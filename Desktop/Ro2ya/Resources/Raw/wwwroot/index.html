<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate live accuracy updates
            const accuracyEl = document.querySelector('.font-h1.text-h1.text-primary-container');
            setInterval(() => {
                const randomAcc = (98 + Math.random() * 1.5).toFixed(1);
                if (accuracyEl) accuracyEl.innerHTML = `${randomAcc}<span class="text-h2">%</span>`;
            }, 3000);

            // Button active state simulation
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
                btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
                btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
            });
        });
    </script>
